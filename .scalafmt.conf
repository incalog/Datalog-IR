version = 3.4.3
runner.dialect = scala213
encoding = "UTF-8"
docstrings.style = Asterisk

maxColumn = 100

assumeStandardLibraryStripMargin = true

binPack.literalArgumentLists = true

indent {
  main = 2
  significant = 2
  callSite = 2
  defnSite = 4
}
continuationIndent {
  callSite = 2
  defnSite = 4
}

align.preset = none

align {
  openParenCallSite = false
  openParenDefnSite = false
}

newlines {
  alwaysBeforeElseAfterCurlyIf = false
  afterCurlyLambdaParams = never
  neverInResultType = true
  selectChains = keep
  forceBeforeMultilineAssign = never
}

danglingParentheses {
  defnSite = true
  callSite = false
}

verticalMultiline {
  atDefnSite = true
  newlineAfterOpenParen = true
}

rewrite {
  rules = [ExpandImportSelectors, RedundantParens, PreferCurlyFors, SortImports, SortModifiers]
  sortModifiers.order = [
    "implicit", "final", "sealed", "abstract",
    "override", "private", "protected", "lazy"]
}

project.git = true

literals {
  long = Upper
  float = Lower
  double = Lower
}

lineEndings = unix
