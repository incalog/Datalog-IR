# Functional options
[fun_logging]
# log typed version
typed = true
# steps to log
module = true
#mono = true
#defun = true
normalized = true

# General IR options
[ir_logging]
# log typed version
typed = true
# lowerings
module = true
lowerings = true
# Optimizations
optimizations = true
# Stats
stats_before_lowering = false
stats_before_optimization = false
stats_after_optimization = false