### Frontend
[fun_logging]
# log typed version
typed = false
# steps to log
module = false
#mono = true
#defun = true
normalized = false
# log all relations
verbose_output = true

### IR
[ir_logging]
# log typed version
typed = false
# lowerings
module = false
lowerings = false
# Optimizations
optimizations = true
# Stats
stats_before_lowering = false
stats_before_optimization = false
stats_after_optimization = false

### Viatra
[viatra_logging]
# log typed version
typed = false
# base module and lowerings
module = false
lowerings = false
# psystem code
psystem = false

[viatra_options]
apply_double_aggregation_rewrite = true