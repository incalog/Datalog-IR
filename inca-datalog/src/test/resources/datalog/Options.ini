### Frontend
[datalog_logging]
# log typed version
typed = true
# steps to log
module = false
verbose_output = false


### IR
[ir_logging]
# log typed version
typed = true
# lowerings
module = true
lowerings = true
# Optimizations
optimizations = false
# Stats
stats_before_lowering = false
stats_before_optimization = false
stats_after_optimization = false


### Viatra
[viatra_logging]
# log typed version
typed = true
# base module and lowerings
module = false
lowerings = false
# psystem code
psystem = false

[viatra_options]
apply_double_aggregation_rewrite = true