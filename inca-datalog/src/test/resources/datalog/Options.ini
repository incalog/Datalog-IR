### Frontend
[datalog_logging]
# log typed version
typed = true
# steps to log
module = true

### IR
[ir_logging]
# log typed version
typed = true
# lowerings
module = true
lowerings = true
# Optimizations
optimizations = true
# Stats
stats_before_lowering = false
stats_before_optimization = false
stats_after_optimization = false

### Viatra
[viatra_logging]
# log typed version
typed = true
# base module and lowerings
module = true
lowerings = true
# psystem code
psystem = true

[viatra_options]
apply_double_aggregation_rewrite = true