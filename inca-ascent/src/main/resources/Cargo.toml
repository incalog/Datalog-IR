# This Cargo.toml file is copied and used for all Ascent projects

[package]
name = "ascent_project"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
csv = "1.1"
ascent = "0.7"
serde = { version = "1.0.144", features = ["derive"] }
serde_json = "1.0.85"
regex = "1"

[profile.dev]
opt-level = 3

[profile.release]
opt-level = 3
overflow-checks = false