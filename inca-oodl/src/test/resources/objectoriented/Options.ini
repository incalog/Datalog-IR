### Frontend
[oodl_logging]
# log typed version
typed = false
# steps to log
module = true
ssa = false


### IR
[ir_logging]
# log typed version
typed = true
# lowerings
module = false
lowerings = false
# Optimizations
optimizations = false
# Stats
stats_before_lowering = false
stats_before_optimization = false
stats_after_optimization = false


### Viatra
[viatra_logging]
# log typed version
typed = false
# base module and lowerings
module = true
lowerings = true
# psystem code
psystem = true

[viatra_options]
apply_double_aggregation_rewrite = true